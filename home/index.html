        e.preventDefault();

      const isCtrlOrMeta = e.ctrlKey || e.metaKey;

      if ((e.ctrlKey && e.shiftKey && key === 'j') || (e.metaKey && e.altKey && key === 'j') || (e.ctrlKey && e.shiftKey && e.keyCode === 74)) {

      if ((e.ctrlKey && e.shiftKey && key === 'c') || (e.metaKey && e.altKey && key === 'c') || (e.ctrlKey && e.shiftKey && e.keyCode === 67)) {
        e.preventDefault();

  <script>
    (() => {
      const profile = document.querySelector(".public-profile-root");
      const player = document.getElementById("bio-audio-player");
      if (!profile || !player) return;

      const audio = player.querySelector("audio");
      const restartButton = player.querySelector('[aria-label="Restart track"]');
      const playButton = player.querySelector('[aria-label="Pause"]');
      const nextButton = player.querySelector('[aria-label="Next"]');
      const volumeButton = player.querySelector('[aria-label="Volume"]');
      const seekBar = player.querySelector('[title="Seek playback"]');
      const progress = seekBar && seekBar.querySelector(".w-full > div");
      const timeLabels = seekBar && seekBar.parentElement.querySelectorAll("span");
      const card = document.querySelector("main > div");
      if (!audio || !playButton || !seekBar || !progress || !timeLabels || timeLabels.length < 2) return;

      audio.volume = 0.22;
      const status = document.createElement("p");
      status.className = "mt-2 text-xs text-white/70";
      status.setAttribute("role", "status");
      status.hidden = true;
      player.insertAdjacentElement("afterend", status);

      const reportAudioError = (message, error) => {
        status.textContent = message;
        status.hidden = false;
        if (error) console.error(message, error);
      };

      const formatTime = (seconds) => {
        if (!Number.isFinite(seconds)) return "0:00";
        const minutes = Math.floor(seconds / 60);
        const remainder = Math.floor(seconds % 60).toString().padStart(2, "0");
        return `${minutes}:${remainder}`;
      };

      const updatePlaybackButton = () => {
        const playing = !audio.paused;
        playButton.title = playing ? "Pause" : "Play";
        playButton.setAttribute("aria-label", playButton.title);
        playButton.innerHTML = playing
          ? '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 fill-current text-white/95" aria-hidden="true"><rect x="14" y="3" width="5" height="18" rx="1"></rect><rect x="5" y="3" width="5" height="18" rx="1"></rect></svg>'
          : '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 fill-current text-white/95" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>';
      };

      const updateProgress = () => {
        const duration = audio.duration;
        const percentage = Number.isFinite(duration) && duration > 0
          ? (audio.currentTime / duration) * 100
          : 0;
        progress.style.width = `${percentage}%`;
        timeLabels[0].textContent = formatTime(audio.currentTime);
        if (Number.isFinite(duration)) timeLabels[1].textContent = formatTime(duration);
        seekBar.setAttribute("aria-valuenow", Math.round(percentage).toString());
      };

      const playAudio = () => {
        audio.play().then(() => {
          status.hidden = true;
        }).catch((error) => {
          reportAudioError("Audio could not be played. Check your connection and try the Play button.", error);
        });
      };

      audio.addEventListener("play", updatePlaybackButton);
      audio.addEventListener("pause", updatePlaybackButton);
      audio.addEventListener("timeupdate", updateProgress);
      audio.addEventListener("loadedmetadata", updateProgress);
      audio.addEventListener("error", () => {
        reportAudioError("The hosted audio could not be loaded. Check your internet connection.");
      });
      updatePlaybackButton();
      updateProgress();

      playButton.addEventListener("click", () => {
        if (audio.paused) playAudio();
        else audio.pause();
      });

      restartButton.addEventListener("click", () => {
        audio.currentTime = 0;
        playAudio();
      });

      nextButton.title = "Replay current track (only one track is saved)";
      nextButton.addEventListener("click", () => {
        audio.currentTime = 0;
        playAudio();
      });

      if (volumeButton) {
        const volumeLevels = [0, 0.22, 0.5, 1];
        volumeButton.addEventListener("click", () => {
          const currentIndex = volumeLevels.findIndex((level) => Math.abs(level - audio.volume) < 0.01);
          audio.volume = volumeLevels[(currentIndex + 1) % volumeLevels.length];
          const percentage = Math.round(audio.volume * 100);
          volumeButton.title = `Volume: ${percentage}%`;
          volumeButton.setAttribute("aria-label", `Volume: ${percentage}%`);
        });
      }

      seekBar.setAttribute("role", "slider");
      seekBar.setAttribute("aria-label", "Seek playback");
      seekBar.setAttribute("aria-valuemin", "0");
      seekBar.setAttribute("aria-valuemax", "100");
      seekBar.tabIndex = 0;
      seekBar.addEventListener("click", (event) => {
        if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
        const bounds = seekBar.getBoundingClientRect();
        const fraction = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
        audio.currentTime = fraction * audio.duration;
        updateProgress();
      });
      seekBar.addEventListener("keydown", (event) => {
        if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;
        if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
          event.preventDefault();
          const direction = event.key === "ArrowRight" ? 5 : -5;
          audio.currentTime = Math.max(0, Math.min(audio.duration, audio.currentTime + direction));
          updateProgress();
        }
      });

      const entryScreen = document.createElement("button");
      entryScreen.type = "button";
      entryScreen.setAttribute("aria-label", "Click to enter and start the music");
      entryScreen.innerHTML = '<span style="font:600 14px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase">[ click to enter ]</span><span style="margin-top:12px;font:400 12px system-ui,sans-serif;color:rgba(255,255,255,.55)">Continue to the profile and start the music</span>';
      Object.assign(entryScreen.style, {
        position: "fixed",
        inset: "0",
        zIndex: "1000",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        justifyContent: "center",
        width: "100%",
        height: "100%",
        border: "0",
        background: "rgba(5,5,5,.82)",
        color: "#fff",
        cursor: "pointer",
        backdropFilter: "blur(10px)",
        transition: "opacity .35s ease"
      });
      document.body.appendChild(entryScreen);
      entryScreen.addEventListener("click", () => {
        entryScreen.style.opacity = "0";
        entryScreen.disabled = true;
        window.setTimeout(() => entryScreen.remove(), 350);
        playAudio();
      }, { once: true });

      if (card) {
        const getCardScale = () => Number.parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--profile-card-scale")) || 1;
        const resetCardTilt = () => {
              const cardScale = getCardScale();
              card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(${cardScale},${cardScale},${cardScale})`;
          card.style.boxShadow = "0 20px 40px rgba(0,0,0,.6)";
        };
        window.addEventListener("pointermove", (event) => {
          if (event.pointerType === "touch") return;
          const x = Math.max(0, Math.min(1, event.clientX / window.innerWidth));
          const y = Math.max(0, Math.min(1, event.clientY / window.innerHeight));
          const rotateY = (x - 0.5) * 8;
          const rotateX = (0.5 - y) * 8;
          const cardScale = getCardScale();
          card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(${cardScale * 1.015},${cardScale * 1.015},${cardScale * 1.015})`;
          card.style.boxShadow = `${-rotateY * 2}px ${20 + rotateX * 2}px 45px rgba(0,0,0,.55)`;
        });
        window.addEventListener("pointerleave", resetCardTilt);
        window.addEventListener("blur", resetCardTilt);
      }

    })();
  </script>
</body>

</html>
